name: Validate API catalog
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/validate_catalog.py
      - run: python3 scripts/validate_demos.py
      - run: python3 -m unittest discover -s tests -v
      - run: node --check examples/javascript/run.mjs
      - run: bash -n examples/curl/run.sh
